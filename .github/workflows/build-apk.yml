name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create .env file
        run: |
          cat > .env << 'EOL'
          APP_URL=nebulaai://app
          ENABLE_PALSHUB_INTEGRATION=false
          ENABLE_AUTHENTICATION=false
          ENABLE_OFFLINE_MODE=true
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com
          EOL

      - name: Create dummy google-services.json
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-for-ci",
              "storage_bucket": "dummy-project-for-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.nebulaai"
                }
              },
              "api_key": [{
                "current_key": "dummy-api-key-for-ci-builds"
              }],
              "services": {
                "appinvite_service": {
                  "status": 1
                }
              }
            }]
          }
          EOL

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download missing fonts (Manrope, Space Grotesk)
        run: |
          mkdir -p src/assets/fonts android/app/src/main/assets/fonts
          cd src/assets/fonts
          curl -sL -o Manrope-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/manrope/Manrope-Regular.ttf"
          curl -sL -o Manrope-Medium.ttf "https://github.com/google/fonts/raw/main/ofl/manrope/Manrope-Medium.ttf"
          curl -sL -o Manrope-SemiBold.ttf "https://github.com/google/fonts/raw/main/ofl/manrope/Manrope-SemiBold.ttf"
          curl -sL -o Manrope-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/manrope/Manrope-Bold.ttf"
          curl -sL -o SpaceGrotesk-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/spacegrotesk/SpaceGrotesk-Regular.ttf"
          curl -sL -o SpaceGrotesk-Medium.ttf "https://github.com/google/fonts/raw/main/ofl/spacegrotesk/SpaceGrotesk-Medium.ttf"
          curl -sL -o SpaceGrotesk-SemiBold.ttf "https://github.com/google/fonts/raw/main/ofl/spacegrotesk/SpaceGrotesk-SemiBold.ttf"
          curl -sL -o SpaceGrotesk-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/spacegrotesk/SpaceGrotesk-Bold.ttf"
          cp *.ttf ../../../android/app/src/main/assets/fonts/
          ls -la

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK and test APK
        working-directory: android
        run: ./gradlew assembleProdDebug assembleProdDebugAndroidTest --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger

      - name: Run Android Emulator Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048
          script: |
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            adb install -r android/app/build/outputs/apk/prod/debug/*.apk
            adb install -r android/app/build/outputs/apk/androidTest/prod/debug/*.apk
            adb shell am instrument -w -r \
              -e class com.nebulaai.MainActivityTest,com.nebulaai.AppInstrumentedTest \
              com.nebulaai.test/androidx.test.runner.AndroidJUnitRunner

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NebulaAI-debug-apk
          path: android/app/build/outputs/apk/prod/debug/*.apk
          retention-days: 30

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NebulaAI-test-apk
          path: android/app/build/outputs/apk/androidTest/prod/debug/*.apk
          retention-days: 30
